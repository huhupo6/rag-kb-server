# docker-compose.yml
# RAG 知识库系统主编排文件
# 包含：Django、DRF、Celery、RabbitMQ、Redis、MySQL、Milvus、FastAPI
# MinerU 文档解析服务独立于本文件，单独部署，通过 HTTP API 跨服务调用

services:
  # 1. MySQL 数据库
  db:
    image: mysql:8.0
    container_name: kb_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: kb_db
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_ft_min_token_size=1
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Redis 缓存与消息队列
  redis:
    image: redis:7.0-alpine
    container_name: kb_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Django Web 服务
  web:
    build: .
    container_name: kb_web
    restart: always
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rabbitmq
      - mineru-api

  # 4. Celery Worker
  celery_worker:
    build: .
    container_name: kb_celery_worker
    restart: always
    command: celery -A kb_project worker -l info --pool=solo
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rabbitmq
      - mineru-api

  # 5. Celery Beat
  celery_beat:
    build: .
    container_name: kb_celery_beat
    restart: always
    command: celery -A kb_project beat -l info
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rabbitmq
      - mineru-api

  # 6. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # 通信端口
      - "15672:15672" # 后台管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  # 7. MinerU 独立解析微服务
  mineru-api:
    build:
      context: .
      dockerfile: Dockerfile.mineru.cpu
    container_name: mineru-api
    restart: always
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      MINERU_MODEL_SOURCE: modelscope
      MODELSCOPE_HUB: /root/.cache/modelscope/hub
      MINERU_DEVICE: cpu
    volumes:
      - ./mineru_models:/root/.cache/modelscope/hub
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host

  # 8. FastAPI 混合检索与 AI 问答微服务
  fastapi-app:
    build: ./fastapi_service
    container_name: kb_fastapi
    restart: always
    ports:
      - "9000:9000"  # 宿主机访问 9000 端口
    volumes:
      - ./fastapi_service:/app  # 挂载代码，支持热更新
    env_file:
      - .env
    depends_on:
      - db

# 数据卷
volumes:
  mysql_data:
  media_data:
